[package]
name = "orb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The desktop UI: the panel drawn from the SVG art set (assets/ui) with egui"

[lib]
path = "src/lib.rs"

# The file name is the process name the macOS Dock and Activity Monitor show (task-104).
[[bin]]
name = "OpenRB-338"
path = "src/main.rs"
required-features = ["app"]

# `app`: the standalone window on eframe (the binary, `impl eframe::App for App`; on wasm32 the
# web page, `orb_ui::web`, task-172). The panel itself needs only egui, so the plugin's editor
# (orb-plugin, task-201) takes the library without it and links no eframe or winit.
[features]
default = ["app"]
app = ["dep:eframe"]

[dependencies]
orb-engine = { path = "../orb-engine" }
# The player the panel drives (task-045) and its audio output.
orb-player = { path = "../orb-player" }
# Song files and the standard mod (the built-in drum samples).
rbs = { path = "../rbs" }
rbm = { path = "../rbm" }
# The export and the mod lookup of `orb render` (task-047); natively with its Ogg encoder
# (below), which the web build has not (task-172).
orb-cli = { path = "../orb-cli", default-features = false }
# The settings file (task-107).
serde = { version = "1", features = ["derive"] }
toml = "=0.9.12"
eframe = { version = "0.37.0", optional = true }
# egui 0.37 has no default features: its fonts (`default_fonts`) come with eframe's defaults
# in the standalone app only, so the panel asks for them itself (the plugin links no eframe;
# without them every egui text is drawn as boxes, found in Reaper, task-201).
egui = { version = "0.37.0", features = ["default_fonts"] }
egui_extras = { version = "0.37.0", features = ["svg"] }
# Renders the window icon and gives the panel's part rasterizing its options; the version
# egui_extras' SVG loader uses.
resvg = { version = "0.45.1", default-features = false }
# Saves the --screenshot PNG; decodes the mods' splash.jpg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The pattern as JSON on the clipboard (task-287); the web's collection index (task-174).
serde_json = "1"
# The check of a collection file the web page downloads (task-174).
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The standalone window's second renderer: OpenGL through glutin, tried when wgpu cannot start
# (task-328: macOS 11 on an old Mac, "Parent device is lost"). Not on wasm32: the web page
# keeps wgpu alone; the plugin takes this crate without `app` and links no eframe.
eframe = { version = "0.37.0", optional = true, features = ["glow"] }
orb-cli = { path = "../orb-cli", default-features = false, features = ["ogg"] }
# The native message box of the crash hook (task-157). No default features: on Linux the
# box is run by `zenity` at run time (no GTK or other system library to link), and the Wayland
# window-identifier code is not needed for a box without a parent window.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The plugin's direct clipboard read (task-287; egui-baseview reads the clipboard only on a
# paste key, which a plugin leaves to the host). The version egui-winit already links. No
# default features: the image support is not needed. On Linux it speaks X11 only (a pure
# Wayland session without XWayland reads nothing, and Paste shows "holds no pattern").
arboard = { version = "3.7", default-features = false }

# The web build (task-172, docs/web.md): the AudioWorklet output of orb-player, the browser
# glue (file pickers, downloads, localStorage, the error box) and `Instant` (std's panics on
# wasm32-unknown-unknown). Pinned to the versions of Cargo.lock, as orb-player's.
[target.'cfg(target_arch = "wasm32")'.dependencies]
orb-player = { path = "../orb-player", features = ["web"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "History",
  "HtmlInputElement",
  "Location",
  "Navigator",
  "Node",
  "PopStateEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "RequestCache",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "Window",
] }
web-time = "=1.1.0"

[dev-dependencies]
orb-ui-art = { path = "../orb-ui-art" }
# The gated tests' external inputs (task-121).
orb-testkit = { path = "../orb-testkit" }
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3"
