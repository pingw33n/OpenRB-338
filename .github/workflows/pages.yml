# The GitHub Pages site (task-212): the landing page of site/, built into one folder by
# tools/build_site.py, deployed at https://pingw33n.github.io/OpenRB-338/. It runs when a
# release is PUBLISHED (a tag push only makes a draft whose assets are not public yet) and by
# hand. The download links come from the release's tag at build time, and the build HEADs every
# one of them, so it fails instead of deploying a dead link. One Pages artifact holds the whole
# site: the web app (task-175) is built in the same job with the tag's version and the
# collection index of the two repositories' current commits, and goes into the folder under
# web/ (docs/building.md "The web page"). A redeploy by hand picks up new collection commits.
# A collection is cloned only when its commit (or the index code) changed (task-322).
#
# One-time setting (docs/building.md): Settings > Pages > Source: GitHub Actions. Until it is
# set, the deploy job fails at deploy-pages with "Pages site not found / not enabled".
# Also the github-pages environment must allow the tag rule v* (Settings > Environments), or a
# published release's deploy is refused.
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to take the downloads from (empty: the latest published release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/release-env.sh (the web build's ORB_BUILD_BRANCH) reads the history
          fetch-depth: 0
      - name: Choose the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${EVENT_TAG:-$INPUT_TAG}
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{4}\.[0-9]{4}$'; then
            echo "::error::the tag '$tag' is not of the form vYYYY.MMDD.HHMM"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Site for release $tag"
      - name: Test the detection and the builder
        run: |
          node site/detect_test.js
          python3 -m unittest tools/build_site_test.py
      # The web app (task-175, docs/web.md sections 7 to 9). Its version is the tag's, as in
      # release.yml (scripts/release-env.sh).
      - name: Build environment of the web app
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: scripts/release-env.sh "$TAG" | tee -a "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pages-web
      # wasm-bindgen-cli at the version scripts/build-web.sh checks for. rust-cache keeps the
      # installed binary between runs.
      - name: Install wasm-bindgen-cli
        run: |
          want=$(sed -n 's/^want=//p' scripts/build-web.sh)
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $want" ]; then
            cargo install wasm-bindgen-cli --version "$want" --locked
          fi
      # wasm-opt of binaryen at the version scripts/binaryen.sh pins (task-323), checked against
      # its SHA-256. build-web.sh finds it in target/ and runs it on the page's module.
      - name: Install wasm-opt
        run: scripts/binaryen.sh
      # The clones, both target folders and the wasm-bindgen-cli build need roughly 8 GB. On the
      # first run the runner showed 86 GB available on /: one observation, not a guarantee
      # of the runner's size. The log shows what is left on each run.
      - name: Free disk space
        run: df -h
      # The collections (task-322). The current commit of each is asked with `git ls-remote`
      # (no download). What `orb web-index` derives from a collection alone, its part, is
      # cached under a key of the commit and of the code that makes the part: the web-index code
      # and what it reads (info.rs, mods.rs, render.rs, fs.rs, lib.rs of orb-cli, and the engine, rbs and rbm sources that load a song and a mod, Cargo.lock), which holds the index format
      # version (webindex.rs VERSION). A change to any of them, or a new commit, is a miss and
      # clones that collection only. The song-to-mod resolution is made when the parts are
      # combined, so it is current even if one side came from the cache. GitHub drops a cache
      # entry unused for 7 days; the next run then clones once again (docs/building.md).
      - name: Current commits of the collections
        run: |
          {
            echo "SONGS_COMMIT=$(git ls-remote https://github.com/pingw33n/rb-songs.git refs/heads/main | cut -f1)"
            echo "MODS_COMMIT=$(git ls-remote https://github.com/pingw33n/rb-mods.git refs/heads/main | cut -f1)"
          } | tee -a "$GITHUB_ENV"
          for v in SONGS_COMMIT MODS_COMMIT; do
            printf '%s' "${!v}" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::$v is empty or not a commit"; exit 1; }
          done
      - name: Part of rb-songs from the cache
        id: songs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/web-index/songs.part
          key: web-index-songs-${{ hashFiles('crates/orb-cli/src/webindex.rs', 'crates/orb-cli/src/info.rs', 'crates/orb-cli/src/mods.rs', 'crates/orb-cli/src/render.rs', 'crates/orb-cli/src/fs.rs', 'crates/orb-cli/src/lib.rs', 'crates/orb-engine/src/**', 'crates/rbs/src/**', 'crates/rbm/src/**', 'Cargo.lock') }}-${{ env.SONGS_COMMIT }}
      - name: Part of rb-mods from the cache
        id: mods-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/web-index/mods.part
          key: web-index-mods-${{ hashFiles('crates/orb-cli/src/webindex.rs', 'crates/orb-cli/src/info.rs', 'crates/orb-cli/src/mods.rs', 'crates/orb-cli/src/render.rs', 'crates/orb-cli/src/fs.rs', 'crates/orb-cli/src/lib.rs', 'crates/orb-engine/src/**', 'crates/rbs/src/**', 'crates/rbm/src/**', 'Cargo.lock') }}-${{ env.MODS_COMMIT }}
      # cpal (orb-player, under orb-cli) links ALSA: the same headers as ci.yml and release.yml.
      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Build orb
        run: cargo build --locked --release -p orb-cli
      # On a miss: the collection at that commit, shallow (a blobless clone does not help:
      # `orb web-index` reads every file for its size, hash and mod name), then its part. The
      # folders are named songs and mods as in the repositories. The clone is checked out at
      # the commit asked above (a push in between would give a newer one the index must not
      # pin), and the cache saves the part when the job succeeds.
      - name: Part of rb-songs from a clone
        if: steps.songs-cache.outputs.cache-hit != 'true'
        run: |
          echo "rb-songs $SONGS_COMMIT: cache miss, cloning"
          scripts/clone-collection.sh rb-songs "$SONGS_COMMIT" "$RUNNER_TEMP/collections"
          mkdir -p "$RUNNER_TEMP/web-index"
          target/release/orb web-index --songs "$RUNNER_TEMP/collections/rb-songs/songs" \
            --write-songs-part "$RUNNER_TEMP/web-index/songs.part"
      - name: Part of rb-mods from a clone
        if: steps.mods-cache.outputs.cache-hit != 'true'
        run: |
          echo "rb-mods $MODS_COMMIT: cache miss, cloning"
          scripts/clone-collection.sh rb-mods "$MODS_COMMIT" "$RUNNER_TEMP/collections"
          mkdir -p "$RUNNER_TEMP/web-index"
          target/release/orb web-index --mods "$RUNNER_TEMP/collections/rb-mods/mods" \
            --write-mods-part "$RUNNER_TEMP/web-index/mods.part"
      - name: Index the collections
        env:
          SONGS_HIT: ${{ steps.songs-cache.outputs.cache-hit }}
          MODS_HIT: ${{ steps.mods-cache.outputs.cache-hit }}
        run: |
          echo "rb-songs $SONGS_COMMIT: $([ "$SONGS_HIT" = true ] && echo 'part from the cache, not cloned' || echo 'cloned, part made')"
          echo "rb-mods $MODS_COMMIT: $([ "$MODS_HIT" = true ] && echo 'part from the cache, not cloned' || echo 'cloned, part made')"
          target/release/orb web-index \
            --songs-part "$RUNNER_TEMP/web-index/songs.part" \
            --mods-part "$RUNNER_TEMP/web-index/mods.part" \
            --songs-commit "$SONGS_COMMIT" --mods-commit "$MODS_COMMIT" \
            -o "$RUNNER_TEMP/index.json"
      - name: Build the web app
        run: scripts/build-web.sh --index "$RUNNER_TEMP/index.json"
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: >
          python3 tools/build_site.py --tag "$TAG" --out _site
          --release-sizes --check-urls --web dist/web
      # GitHub Pages publishes at most 1 GB; stop well before it (409600 KiB = 400 MiB).
      - name: Check the size of the site
        run: |
          du -sh _site _site/web
          kb=$(du -sk _site | cut -f1)
          [ "$kb" -lt 409600 ] || { echo "::error::the site is $kb KiB"; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
